- type: entity
  parent: CMUEmploymentConsoleColony
  id: CMUConstableTerminal
  name: constable department management console
  suffix: Prototype
  description: A security desk with public ID services, department management and paperwork for the Colony
    Administrator.
  components:
  - type: CMUEmploymentConsole
    requiredAccess: AU14AccessColonyMarshall
    heading: cmu-employment-office-heading
    allowedAccess:
    - CMAccessColonyPublic
    - CMAccessColonyBrig
    - CMAccessColonyArmory
    restrictedAccess: []
    accessNames: {}
    jobIcons: {}
    presets:
    - name: cmu-employment-role-constable
      jobTitle: cmu-employment-role-constable
      access:
      - CMAccessColonyPublic
      - CMAccessColonyBrig
      - CMAccessColonyArmory
    - name: cmu-employment-role-deputy
      jobTitle: cmu-employment-role-deputy
      access:
      - CMAccessColonyPublic
      - CMAccessColonyBrig
      - CMAccessColonyArmory
    - name: cmu-employment-role-security-officer
      jobTitle: cmu-employment-role-security-officer
      access:
      - CMAccessColonyPublic
      - CMAccessColonyBrig
      - CMAccessColonyArmory
  - type: CMUEmploymentOffice
    department: AU14DepartmentColonySecurity
    publicDesk: true
    securityBranding: true
    jail: false
    requiresApproval: true

