- type: entity
  abstract: true
  parent: CMBaseStructure
  id: CMUEmploymentConsoleBase
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: SmallObjects
    sprite: CMU14/Structures/Machines/Employment/govfor.rsi
    noRot: true
    layers:
    - state: off
      map: ["enum.CMUEmploymentVisuals.State"]
  - type: Appearance
  - type: CMUEmploymentVisual
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: RMCPowerReceiver
    idleLoad: 10
    activeLoad: 100
    channel: Equipment
  - type: ActivatableUI
    key: enum.CMUEmploymentUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CMUEmploymentUiKey.Key:
        type: CMUEmploymentBui
  - type: ContainerContainer
    containers:
      CMUEmploymentOperator: !type:ContainerSlot
      CMUEmploymentTarget: !type:ContainerSlot
      CMUEmploymentApprovalPaper: !type:ContainerSlot
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

